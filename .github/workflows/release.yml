name: Publish validated 1.0
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_check.py
      - run: |
          test "$(cat VERSION)" = '1.0.0'
          python scripts/package_release.py
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
          else
            gh release create v1.0.0 dist/Cypriot-syllabic-Greek-1.0.0.zip dist/SHA256SUMS --target "$GITHUB_SHA" --title '1.0.0 — attributed source snapshot and research toolkit' --notes-file docs/RELEASE_1_0.md
          fi
