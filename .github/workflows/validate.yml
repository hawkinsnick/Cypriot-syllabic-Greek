name: Validate corpus snapshot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/release_check.py
      - name: Rebuild and check deterministic generated data
        run: |
          python -m csg build
          python -m csg export --output exports
          git diff --exit-code -- data/records.json data/signs.json exports
      - name: Validate >9 method-parity interfaces
        run: |
          python scripts/test_preexpert_parity.py
          python scripts/build_corpus_browser.py
          test -s workbench/corpus-browser.html
          python scripts/research_api.py records --limit 2 > /tmp/csg-api.json
          python scripts/export_research_layer.py /tmp/csg.json
          test -s /tmp/csg.json.manifest.json
